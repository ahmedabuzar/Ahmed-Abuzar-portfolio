<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Subtle Obsidian Rounded Container -->
  <rect width="512" height="512" rx="140" fill="#0a0a0c"/>
  <rect x="6" y="6" width="500" height="500" rx="134" fill="none" stroke="#22222a" stroke-width="8"/>
  
  <!-- Minimalist Geometric 'A' Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Peak & Legs -->
    <path d="M 160 360 L 256 140 L 352 360" stroke="#ffffff" stroke-width="36"/>
    <!-- Subtle Crossbar -->
    <path d="M 200 285 L 312 285" stroke="#ffffff" stroke-width="28"/>
  </g>

  <!-- Signature Subtle Orange Accent Dot -->
  <circle cx="395" cy="350" r="22" fill="#e85d2a"/>
</svg>
