<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45"/>
      <stop offset="100%" stop-color="#e85d2a"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Circle Background with Subtle Orange Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#e85d2a" stroke-width="12" />
  
  <!-- Stylized "A" Monogram + Analytics Bar Chart -->
  <!-- Left Bar -->
  <rect x="140" y="240" width="36" height="150" rx="8" fill="#ffffff" opacity="0.9" />
  <!-- Center Bar (Taller, Accent Color) -->
  <rect x="204" y="160" width="36" height="230" rx="8" fill="url(#accentGrad)" />
  <!-- Right Bar (Tallest) -->
  <rect x="268" y="120" width="36" height="270" rx="8" fill="#ffffff" />
  <!-- Ascending Trend Arrow / Peak Dot -->
  <circle cx="380" cy="140" r="24" fill="url(#accentGrad)" />
  <path d="M 140 330 L 222 250 L 286 210 L 380 140" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
